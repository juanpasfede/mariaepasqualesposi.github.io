<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Wall - Maria & Pasquale Sposi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Libreria per la compressione immagini -->
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <style>
        :root { --primary: #d4af37; --secondary: #fdfbf7; --text: #2c3e50; }
        body { font-family: 'Lato', sans-serif; color: var(--text); background-color: var(--secondary); min-height: 100vh; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .font-cursive { font-family: 'Great Vibes', cursive; }
        
        .upload-card {
            background: white;
            border-radius: 2rem;
            box-shadow: 0 10px 30px -10px rgba(212, 175, 55, 0.2);
            border: 1px solid rgba(212, 175, 55, 0.1);
        }

        .img-card {
            break-inside: avoid;
            margin-bottom: 1.5rem;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            background: white;
            transition: transform 0.3s ease;
        }
        .img-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="flex flex-col">

    <!-- Navigazione -->
    <nav class="fixed w-full z-50 bg-[#fdfbf7]/90 backdrop-blur shadow-sm">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <a href="index.html" class="flex items-center text-yellow-700 hover:text-yellow-800 transition">
                <i data-lucide="arrow-left" class="w-5 h-5 mr-2"></i>
                <span class="uppercase tracking-widest text-[10px] md:text-xs font-bold">Torna al sito</span>
            </a>
            <span class="font-cursive text-3xl text-yellow-700">M & P</span>
            <div class="w-20 hidden md:block"></div> <!-- Bilanciamento -->
        </div>
    </nav>

    <main class="flex-grow pt-32 pb-24 px-4 max-w-5xl mx-auto w-full">
        
        <!-- Header Sezione -->
        <div class="text-center mb-12">
            <div class="inline-block p-4 bg-yellow-50 rounded-full mb-6">
                <i data-lucide="camera" class="text-yellow-700 w-10 h-10"></i>
            </div>
            <h1 class="font-serif text-4xl md:text-5xl mb-4 italic text-yellow-700">Wedding Live Wall</h1>
            <p class="text-gray-500 italic max-w-lg mx-auto">
                Scatta, carica e condividi i momenti più belli. Le tue foto appariranno qui in tempo reale e saranno salvate nel nostro album privato.
            </p>
        </div>

        <!-- Area Caricamento -->
        <div class="upload-card p-8 md:p-12 mb-16 text-center">
            <label class="group cursor-pointer block">
                <div class="border-2 border-dashed border-yellow-200 rounded-2xl py-12 group-hover:border-yellow-400 transition-colors">
                    <div id="upload-ui">
                        <i data-lucide="upload-cloud" class="mx-auto mb-4 text-yellow-600 w-12 h-12 group-hover:scale-110 transition-transform"></i>
                        <p class="text-sm font-bold uppercase tracking-widest text-gray-700 mb-2">Seleziona o Scatta una Foto</p>
                        <p class="text-[10px] text-gray-400 uppercase">Massima risoluzione per noi, veloce per tutti</p>
                    </div>
                    
                    <!-- Progress Bar (Nascosta inizialmente) -->
                    <div id="upload-status" class="hidden px-8">
                        <div class="w-full bg-gray-100 rounded-full h-3 mb-3">
                            <div id="progress-bar" class="bg-yellow-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                        <p class="text-xs font-bold text-yellow-700 uppercase animate-pulse">Ottimizzazione e invio in corso...</p>
                    </div>
                </div>
                <input id="photo-input" type="file" class="hidden" accept="image/*" />
            </label>
        </div>

        <!-- Bacheca Foto Live -->
        <div id="live-grid" class="columns-2 md:columns-3 gap-6">
            <!-- Le foto verranno iniettate qui dal JS -->
        </div>

    </main>

    <footer class="py-12 text-center opacity-40 border-t border-gray-100">
        <p class="font-cursive text-2xl text-yellow-700">Maria & Pasquale</p>
        <p class="text-[10px] font-bold uppercase tracking-widest mt-2">25 Luglio 2026</p>
    </footer>

    <script type="module">
        // Import Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-storage.js";

        // --- CONFIGURAZIONE UTENTE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDFKvgs8IV5gg_5fc9T_NUa8gWeUZa9QQg",
            authDomain: "matrimonio-gallery.firebaseapp.com",
            projectId: "matrimonio-gallery",
            storageBucket: "matrimonio-gallery.firebasestorage.app",
            messagingSenderId: "739126728073",
            appId: "1:739126728073:web:72f61c578111abd0983d58",
            measurementId: "G-0ZQQ7ZPDJZ"
        };
        
        // URL del tuo Google Apps Script (Fase 1 della procedura precedente)
        const APPS_SCRIPT_URL = "INSERISCI_QUI_IL_TUO_URL_SCRIPT"; 

        // Inizializzazione
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
        lucide.createIcons();

        const photoInput = document.getElementById('photo-input');
        const progressBar = document.getElementById('progress-bar');
        const uploadStatus = document.getElementById('upload-status');
        const uploadUI = document.getElementById('upload-ui');
        const liveGrid = document.getElementById('live-grid');

        // LOGICA DI CARICAMENTO DOPPIO (Dual Upload)
        photoInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Mostra interfaccia caricamento
            uploadUI.classList.add('hidden');
            uploadStatus.classList.remove('hidden');
            progressBar.style.width = '5%';

            // --- 1. INVIO ORIGINALE A GOOGLE DRIVE ---
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const base64 = reader.result.split(',')[1];
                try {
                    fetch(APPS_SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors", // Necessario per Apps Script
                        body: JSON.stringify({
                            base64: base64,
                            type: file.type,
                            name: file.name
                        })
                    });
                } catch (err) { console.error("Errore Drive:", err); }
            };

            // --- 2. COMPRESSIONE E INVIO A FIREBASE (Wall) ---
            const options = {
                maxSizeMB: 0.3, // Compressione a ~300KB
                maxWidthOrHeight: 1200,
                useWebWorker: true
            }

            try {
                const compressedFile = await imageCompression(file, options);
                const fileName = `${Date.now()}_wall.jpg`;
                const storageRef = ref(storage, `live_wall/${fileName}`);
                const uploadTask = uploadBytesResumable(storageRef, compressedFile);

                uploadTask.on('state_changed', 
                    (snapshot) => {
                        const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                        progressBar.style.width = Math.max(progress, 15) + '%';
                    }, 
                    (error) => {
                        alert("Errore caricamento. Riprova.");
                        resetUploadUI();
                    }, 
                    () => {
                        getDownloadURL(uploadTask.snapshot.ref).then((downloadURL) => {
                            // Salva il link nel database per la bacheca real-time
                            addDoc(collection(db, "live_wall"), {
                                url: downloadURL,
                                timestamp: Date.now()
                            });
                            resetUploadUI();
                        });
                    }
                );
            } catch (error) {
                console.error("Errore compressione:", error);
                resetUploadUI();
            }
        };

        function resetUploadUI() {
            uploadStatus.classList.add('hidden');
            uploadUI.classList.remove('hidden');
            progressBar.style.width = '0%';
            photoInput.value = '';
        }

        // ASCOLTO IN TEMPO REALE (Firestore)
        const q = query(collection(db, "live_wall"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            liveGrid.innerHTML = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                const card = document.createElement('div');
                card.className = "img-card animate__animated animate__fadeInUp";
                card.innerHTML = `
                    <div class="relative group cursor-pointer">
                        <img src="${data.url}" class="w-full h-auto block" loading="lazy">
                        <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <a href="${data.url}" download target="_blank" class="bg-white/90 p-3 rounded-full shadow-lg transform scale-90 group-hover:scale-100 transition-transform">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                            </a>
                        </div>
                    </div>
                `;
                liveGrid.appendChild(card);
            });
        });
    </script>
</body>
</html>
